name: build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'circuit/**'

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      matrix:
        target-hardware: [esp8266, esp32, esp32c3]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: before_install
        if: matrix.target-hardware == 'esp8266'
        run: |
          sudo apt update
          sudo apt install -y gcc git wget make libncurses-dev flex bison python3 python3-pip python3-serial ninja-build
          wget https://dl.espressif.com/dl/xtensa-lx106-elf-linux64-1.22.0-100-ge567ec7-5.2.0.tar.gz

      - name: install
        if: matrix.target-hardware == 'esp8266'
        run: |
          tar -xzf ./xtensa-lx106-elf-linux64-1.22.0-100-ge567ec7-5.2.0.tar.gz
          python3 -m pip install --user -r ./ESP8266_RTOS_SDK/requirements.txt || true

      - name: script
        id: script
        if: matrix.target-hardware == 'esp8266'
        run: |
          export IDF_PATH=$PWD/ESP8266_RTOS_SDK
          export PATH="$PATH:$PWD/xtensa-lx106-elf/bin"
          echo "FIRMWARE=$PWD/build" >> $GITHUB_ENV
          python3 ./idf.py fullclean
          python3 ./idf.py build

      - name: Build for esp32/esp32c3
        if: matrix.target-hardware != 'esp8266'
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v4.4.2
          target: ${{ matrix.target-hardware }}
          path: './'

      - name: Merge bin files (esp8266)
        if: matrix.target-hardware == 'esp8266'
        run: |
          git clone https://github.com/espressif/esptool.git
          python3 ./esptool/esptool.py --chip ${{ matrix.target-hardware }} merge_bin -o build/wireless_esp_dap_full.bin 0x0 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0x10000 build/wireless_esp_dap.bin
          mv build/wireless_esp_dap.bin build/wireless_esp_dap_app.bin

      - name: Merge bin files (esp32)
        if: matrix.target-hardware == 'esp32'
        run: |
          git clone https://github.com/espressif/esptool.git
          python3 ./esptool/esptool.py --chip ${{ matrix.target-hardware }} merge_bin -o build/wireless_esp_dap_full.bin 0x1000 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0x10000 build/wireless_esp_dap.bin
          mv build/wireless_esp_dap.bin build/wireless_esp_dap_app.bin

      - name: Merge bin files (esp32c3)
        if: matrix.target-hardware == 'esp32c3'
        run: |
          git clone https://github.com/espressif/esptool.git
          python3 ./esptool/esptool.py --chip ${{ matrix.target-hardware }} merge_bin -o build/wireless_esp_dap_full.bin 0x0 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0x10000 build/wireless_esp_dap.bin
          mv build/wireless_esp_dap.bin build/wireless_esp_dap_app.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware_${{ matrix.target-hardware }}
          path: |
            build/wireless_esp_dap_full.bin
            build/wireless_esp_dap_app.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
